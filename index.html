<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Aspirasi Siswa | SMAN 3 Tebas</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
}

:root{
    --bg:#06111f;
    --card:rgba(10,25,43,.78);
    --card-border:rgba(111,210,255,.18);

    --primary:#20c8ff;
    --primary-dark:#087eb7;
    --secondary:#5865f2;

    --text:#f4fbff;
    --muted:#91a8ba;

    --input:#0d1d2d;
    --success:#39e58c;
    --danger:#ff5f6d;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'Inter','Segoe UI',sans-serif;
    color:var(--text);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    background:
        radial-gradient(circle at 15% 20%,rgba(32,200,255,.14),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(88,101,242,.14),transparent 30%),
        linear-gradient(135deg,#030914,#071522,#06111f);

    overflow-x:hidden;
}

/* Background lights */

body::before,
body::after{
    content:"";
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
    z-index:-1;
}

body::before{
    background:rgba(32,200,255,.12);
    top:-100px;
    left:-100px;
}

body::after{
    background:rgba(88,101,242,.12);
    bottom:-100px;
    right:-100px;
}

/* Main Card */

.container{
    width:100%;
    max-width:450px;

    padding:30px;

    background:var(--card);

    border:1px solid var(--card-border);

    border-radius:26px;

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.05);

    position:relative;
    overflow:hidden;
}

/* Top glow */

.container::before{
    content:"";
    position:absolute;
    top:0;
    left:15%;
    width:70%;
    height:1px;

    background:linear-gradient(
        90deg,
        transparent,
        var(--primary),
        transparent
    );

    box-shadow:0 0 20px var(--primary);
}

/* Header */

.header{
    text-align:center;
    margin-bottom:24px;
}

.logo{
    width:55px;
    height:55px;

    margin:0 auto 14px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            rgba(32,200,255,.18),
            rgba(88,101,242,.18)
        );

    border:1px solid rgba(32,200,255,.2);

    font-size:27px;

    box-shadow:
        0 0 25px rgba(32,200,255,.12);
}

h2{
    margin:0;

    font-size:22px;
    font-weight:800;

    letter-spacing:-.5px;

    background:linear-gradient(
        90deg,
        #ffffff,
        #9eeaff
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    margin-top:8px;

    font-size:12px;
    color:var(--muted);

    letter-spacing:.5px;
}

/* Date Time */

.datetime-box{
    padding:15px;

    margin-bottom:25px;

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            rgba(32,200,255,.08),
            rgba(88,101,242,.08)
        );

    border:1px solid rgba(32,200,255,.12);

    text-align:center;
}

.date{
    font-size:12px;
    color:var(--muted);

    margin-bottom:5px;
}

.time{
    font-size:22px;
    font-weight:700;

    color:#8eeaff;

    letter-spacing:1px;

    text-shadow:
        0 0 15px rgba(32,200,255,.45);
}

/* Form */

.form-group{
    margin-bottom:17px;
}

label{
    display:block;

    margin-bottom:8px;

    font-size:13px;
    font-weight:600;

    color:#d9edf8;
}

input,
textarea,
select{
    width:100%;

    border:1px solid rgba(255,255,255,.07);

    border-radius:13px;

    background:var(--input);

    color:var(--text);

    padding:13px 14px;

    font-family:inherit;
    font-size:13px;

    outline:none;

    transition:
        border-color .25s,
        box-shadow .25s,
        background .25s,
        transform .25s;
}

input::placeholder,
textarea::placeholder{
    color:#5f7485;
}

select{
    cursor:pointer;
}

select option{
    background:#0d1d2d;
    color:white;
}

textarea{
    min-height:125px;
    resize:vertical;
    line-height:1.6;
}

input:focus,
textarea:focus,
select:focus{
    border-color:rgba(32,200,255,.55);

    background:#0e2133;

    box-shadow:
        0 0 0 3px rgba(32,200,255,.07),
        0 0 20px rgba(32,200,255,.08);

    transform:translateY(-1px);
}

/* Character counter */

.textarea-wrapper{
    position:relative;
}

.counter{
    position:absolute;

    right:12px;
    bottom:10px;

    font-size:10px;

    color:#587082;

    pointer-events:none;
}

/* Button */

button{
    width:100%;

    border:none;
    border-radius:14px;

    padding:14px;

    margin-top:4px;

    font-family:inherit;

    font-size:14px;
    font-weight:700;

    color:white;

    background:
        linear-gradient(
            135deg,
            #11bce9,
            #1479d1
        );

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(20,121,209,.25);

    transition:
        transform .25s,
        box-shadow .25s,
        filter .25s;
}

button:hover{
    transform:translateY(-2px);

    filter:brightness(1.08);

    box-shadow:
        0 12px 30px rgba(20,150,220,.35);
}

button:active{
    transform:translateY(0);
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

/* Status */

.status{
    min-height:20px;

    margin-top:13px;

    text-align:center;

    font-size:12px;
    font-weight:600;
}

.status.success{
    color:var(--success);
}

.status.error{
    color:var(--danger);
}

/* Footer */

.footer{
    text-align:center;

    margin-top:23px;

    font-size:10px;

    color:#60798b;

    letter-spacing:.5px;
}

/* Rocket */

.rocket{
    position:fixed;

    bottom:80px;
    left:50%;

    transform:translateX(-50%);

    font-size:38px;

    opacity:0;

    pointer-events:none;
}

.launch{
    animation:launchRocket 1.5s ease-out forwards;
}

@keyframes launchRocket{

    0%{
        transform:translate(-50%,0) scale(.8);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    55%{
        transform:translate(-50%,-230px) scale(1.15);
        opacity:1;
    }

    100%{
        transform:translate(-50%,-520px) scale(.7);
        opacity:0;
    }
}

/* Mobile */

@media(max-width:480px){

    body{
        padding:15px;
        align-items:center;
    }

    .container{
        padding:24px 20px;
        border-radius:22px;
    }

    h2{
        font-size:20px;
    }

    .time{
        font-size:20px;
    }
}
</style></head><body><div class="container"><div class="header">

    <div class="logo">
        💬
    </div>

    <h2>
        ISI HATI SISWA
    </h2>

    <div class="subtitle">
        ASPIRASI SISWA • SMAN 3 TEBAS
    </div>

</div>

<div class="datetime-box">
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
</div>

<form id="aspirasiForm">

    <div class="form-group">

        <label for="nama">
            👤 Nama
        </label>

        <input
            type="text"
            id="nama"
            maxlength="100"
            placeholder="Masukkan nama kamu"
            required
        >

    </div>

    <div class="form-group">

        <label for="kelas">
            🎓 Kelas
        </label>

        <select id="kelas" required>

            <option value="" disabled selected>
                Pilih kelas
            </option>

            <option value="XA">XA</option>
            <option value="XB">XB</option>
            <option value="XIA">XIA</option>
            <option value="XIB">XIB</option>
            <option value="XIIA">XIIA</option>
            <option value="XIIB">XIIB</option>

        </select>

    </div>

    <div class="form-group">

        <label for="isi">
            💭 Isi Hati Kamu
        </label>

        <div class="textarea-wrapper">

            <textarea
                id="isi"
                maxlength="1000"
                placeholder="Sampaikan aspirasi, kritik, saran, atau keluhan kamu..."
                required
            ></textarea>

            <span class="counter" id="counter">
                0/1000
            </span>

        </div>

    </div>

    <button type="submit" id="submitBtn">
        🚀 Kirim Aspirasi
    </button>

    <div class="status" id="status"></div>

</form>

<div class="footer">
    SMANTI WEB SYSTEM • ASPIRASI SISWA
</div>

</div><div id="rocket" class="rocket">
    🚀
</div><script>

/* =========================
   DATE & TIME
========================= */

function updateDateTime(){

    const now = new Date();

    const dateOptions = {
        weekday:"long",
        year:"numeric",
        month:"long",
        day:"numeric"
    };

    document.getElementById("date").textContent =
        "📅 " +
        now.toLocaleDateString("id-ID",dateOptions);

    document.getElementById("time").textContent =
        "⌚ " +
        now.toLocaleTimeString("id-ID");

}

updateDateTime();

setInterval(updateDateTime,1000);


/* =========================
   CHARACTER COUNTER
========================= */

const isi = document.getElementById("isi");
const counter = document.getElementById("counter");

isi.addEventListener("input",()=>{

    counter.textContent =
        `${isi.value.length}/1000`;

});


/* =========================
   FORM
========================= */

document
.getElementById("aspirasiForm")
.addEventListener("submit",async function(e){

    e.preventDefault();

    const nama =
        document.getElementById("nama").value.trim();

    const kelas =
        document.getElementById("kelas").value;

    const isiValue =
        document.getElementById("isi").value.trim();

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("submitBtn");

    const rocket =
        document.getElementById("rocket");


    if(!nama || !kelas || !isiValue){

        status.className="status error";
        status.textContent=
            "⚠️ Mohon lengkapi semua data.";

        return;
    }


    /* Rocket */

    rocket.classList.remove("launch");

    void rocket.offsetWidth;

    rocket.classList.add("launch");


    /* Loading */

    button.disabled=true;

    button.textContent=
        "⏳ Mengirim...";

    status.className="status";

    status.textContent="";


    try{

        const response =
            await fetch("/.netlify/functions/aspirasi",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    nama,
                    kelas,
                    isi:isiValue
                })

            });


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Gagal mengirim aspirasi."
            );

        }


        status.className=
            "status success";

        status.textContent=
            "✅ Aspirasi berhasil dikirim!";


        document
            .getElementById("aspirasiForm")
            .reset();


        counter.textContent="0/1000";


    }catch(error){

        console.error(error);

        status.className=
            "status error";

        status.textContent=
            "❌ Gagal mengirim aspirasi. Silakan coba lagi.";

    }finally{

        button.disabled=false;

        button.textContent=
            "🚀 Kirim Aspirasi";

    }

});

</script></body>
</html>
