<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aspirasi Siswa | SMAN 3 Tebas</title>

<meta name="theme-color" content="#06111f">
<meta name="description" content="Sampaikan aspirasi, kritik, saran, dan keluhan untuk SMAN 3 Tebas.">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
}

:root {
    --bg: #06111f;
    --card: rgba(10,25,43,.88);
    --card-border: rgba(111,210,255,.18);
    --primary: #20c8ff;
    --text: #f4fbff;
    --muted: #91a8ba;
    --input: #0d1d2d;
    --success: #39e58c;
    --danger: #ff5f6d;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;

    background:
        radial-gradient(circle at 15% 20%,rgba(32,200,255,.14),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(88,101,242,.14),transparent 30%),
        linear-gradient(135deg,#030914,#071522,#06111f);

    overflow-x: hidden;
}

body::before,
body::after {
    content: "";
    position: fixed;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: -1;
}

body::before {
    background: rgba(32,200,255,.12);
    top: -100px;
    left: -100px;
}

body::after {
    background: rgba(88,101,242,.12);
    bottom: -100px;
    right: -100px;
}

.container {
    width: 100%;
    max-width: 460px;
    padding: 30px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 26px;

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.05);

    position: relative;
    overflow: hidden;
}

.container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    width: 70%;
    height: 1px;
    background: linear-gradient(90deg,transparent,var(--primary),transparent);
    box-shadow: 0 0 20px var(--primary);
}

.header {
    text-align: center;
    margin-bottom: 24px;
}

.logo {
    width: 65px;
    height: 65px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(32,200,255,.18);
    box-shadow: 0 0 25px rgba(32,200,255,.12);
    overflow: hidden;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 6px;
    display: block;
}

h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.5px;
    background: linear-gradient(90deg,#ffffff,#9eeaff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .5px;
}

.datetime-box {
    padding: 15px;
    margin-bottom: 25px;
    border-radius: 17px;

    background: linear-gradient(
        135deg,
        rgba(32,200,255,.08),
        rgba(88,101,242,.08)
    );

    border: 1px solid rgba(32,200,255,.12);
    text-align: center;
}

.date {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
}

.time {
    font-size: 22px;
    font-weight: 700;
    color: #8eeaff;
    letter-spacing: 1px;
    text-shadow: 0 0 15px rgba(32,200,255,.45);
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #d9edf8;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 13px;
    background: var(--input);
    color: var(--text);
    padding: 13px 14px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color .25s, box-shadow .25s, background .25s;
}

input::placeholder,
textarea::placeholder {
    color: #5f7485;
}

select {
    cursor: pointer;
}

select option {
    background: #0d1d2d;
    color: white;
}

textarea {
    min-height: 125px;
    resize: vertical;
    line-height: 1.6;
    padding-bottom: 30px;
}

input:focus,
textarea:focus,
select:focus {
    border-color: rgba(32,200,255,.55);
    background: #0e2133;
    box-shadow: 0 0 0 3px rgba(32,200,255,.07);
}

.textarea-wrapper {
    position: relative;
}

.counter {
    position: absolute;
    right: 12px;
    bottom: 10px;
    font-size: 10px;
    color: #7892a5;
    pointer-events: none;
}

/* UPLOAD */

.upload-box {
    padding: 20px 14px;
    text-align: center;
    border: 1px dashed rgba(32,200,255,.4);
    border-radius: 16px;
    background: rgba(32,200,255,.04);
    transition: .25s;
}

.upload-box:hover {
    border-color: var(--primary);
    background: rgba(32,200,255,.07);
}

.upload-icon {
    font-size: 32px;
    margin-bottom: 9px;
}

.upload-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

.upload-description {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.8;
    margin-bottom: 15px;
}

#fileInput {
    display: none;
}

.upload-button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: auto;
    margin: 0;
    padding: 11px 19px;
    border-radius: 11px;
    background: linear-gradient(135deg,#11bce9,#1479d1);
    color: white;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
}

.upload-button:hover {
    filter: brightness(1.1);
}

.upload-note {
    margin-top: 12px;
    font-size: 10px;
    line-height: 1.8;
    color: #7892a5;
}

.file-info {
    margin-top: 12px;
    font-size: 11px;
    color: #8eeaff;
    overflow-wrap: anywhere;
}

.preview-container {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 10px;
    margin-top: 13px;
}

.preview-item {
    position: relative;
    min-width: 0;
    overflow: hidden;
    border: 1px solid rgba(32,200,255,.2);
    border-radius: 12px;
    background: #071522;
}

.preview-item img,
.preview-item video {
    display: block;
    width: 100%;
    height: 125px;
    object-fit: cover;
    background: #030914;
}

.preview-name {
    padding: 8px;
    font-size: 10px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    color: #d9edf8;
    min-height: 45px;
}

.remove-file {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 28px;
    height: 28px;
    padding: 0;
    margin: 0;
    border-radius: 8px;
    background: rgba(255,60,75,.95);
    color: white;
    font-size: 18px;
    line-height: 1;
    box-shadow: none;
    z-index: 2;
}

.remove-file:hover {
    background: #ff3045;
    transform: scale(1.05);
}

.upload-error {
    color: var(--danger);
    font-size: 11px;
    line-height: 1.6;
    margin-top: 10px;
}

button.submit-button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 14px;
    margin-top: 4px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: white;

    background: linear-gradient(135deg,#11bce9,#1479d1);

    cursor: pointer;
    box-shadow: 0 8px 25px rgba(20,121,209,.25);
    transition: transform .25s, box-shadow .25s, filter .25s;
}

.submit-button:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 12px 30px rgba(20,150,220,.35);
}

.submit-button:disabled {
    opacity: .65;
    cursor: not-allowed;
    transform: none;
}

.status {
    min-height: 20px;
    margin-top: 13px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.status.success {
    color: var(--success);
}

.status.error {
    color: var(--danger);
}

.footer {
    text-align: center;
    margin-top: 23px;
    font-size: 10px;
    color: #60798b;
    letter-spacing: .5px;
}

.rocket {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 38px;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
}

.launch {
    animation: launchRocket 1.5s ease-out forwards;
}

@keyframes launchRocket {
    0% {
        transform: translate(-50%,0) scale(.8);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    55% {
        transform: translate(-50%,-230px) scale(1.15);
        opacity: 1;
    }

    100% {
        transform: translate(-50%,-520px) scale(.7);
        opacity: 0;
    }
}

@media(max-width:480px) {
    body {
        padding: 15px;
        align-items: center;
    }

    .container {
        padding: 24px 20px;
        border-radius: 22px;
    }

    h2 {
        font-size: 20px;
    }

    .time {
        font-size: 20px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="container">

    <header class="header">

        <div class="logo">
            <img
                src="logo.png"
                alt="Logo SMAN 3 Tebas"
                onerror="this.style.display='none'"
            >
        </div>

        <h2>ISI HATI SISWA</h2>

        <div class="subtitle">
            ASPIRASI SISWA • SMAN 3 TEBAS
        </div>

    </header>

    <section class="datetime-box" aria-label="Tanggal dan waktu">

        <div class="date" id="date"></div>
        <div class="time" id="time"></div>

    </section>

    <form id="aspirasiForm">

        <div class="form-group">

            <label for="nama">👤 Nama</label>

            <input
                type="text"
                id="nama"
                name="nama"
                maxlength="100"
                placeholder="Masukkan nama kamu"
                autocomplete="name"
                required
            >

        </div>

        <div class="form-group">

            <label for="kelas">🎓 Kelas</label>

            <select id="kelas" name="kelas" required>

                <option value="" disabled selected>
                    Pilih kelas
                </option>

                <option value="XA">XA</option>
                <option value="XB">XB</option>
                <option value="XIA">XIA</option>
                <option value="XIB">XIB</option>
                <option value="XIIA">XIIA</option>
                <option value="XIIB">XIIB</option>

            </select>

        </div>

        <div class="form-group">

            <label for="isi">💭 Isi Hati Kamu</label>

            <div class="textarea-wrapper">

                <textarea
                    id="isi"
                    name="isi"
                    maxlength="1000"
                    placeholder="Sampaikan aspirasi, kritik, saran, atau keluhan kamu..."
                    required
                ></textarea>

                <span class="counter" id="counter">
                    0/1000
                </span>

            </div>

        </div>

        <div class="form-group">

            <label>📎 Lampiran Foto / Video (Opsional)</label>

            <div class="upload-box">

                <div class="upload-icon">📸</div>

                <div class="upload-title">
                    Lampirkan Foto atau Video
                </div>

                <div class="upload-description">
                    Pilih foto atau video yang mendukung aspirasi kamu.
                </div>

                <label for="fileInput" class="upload-button">
                    📂 Pilih File
                </label>

                <input
                    type="file"
                    id="fileInput"
                    accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm"
                    multiple
                >

                <div class="upload-note">
                    Format: JPG, PNG, WEBP, MP4, MOV, WEBM.
                    <br>
                    Maksimal 3 file • 4 MB per file.
                    <br>
                    Total lampiran maksimal 5 MB.
                </div>

            </div>

            <div
                id="fileInfo"
                class="file-info"
                aria-live="polite"
            ></div>

            <div
                id="previewContainer"
                class="preview-container"
            ></div>

            <div
                id="uploadError"
                class="upload-error"
                role="alert"
            ></div>

        </div>

        <button
            type="submit"
            class="submit-button"
            id="submitBtn"
        >
            🚀 Kirim Aspirasi
        </button>

        <div
            class="status"
            id="status"
            role="status"
            aria-live="polite"
        ></div>

    </form>

    <footer class="footer">
        SMANTI WEB SYSTEM • ASPIRASI SISWA
    </footer>

</main>

<div id="rocket" class="rocket" aria-hidden="true">🚀</div>

<script>
"use strict";

/* =========================
   TANGGAL DAN WAKTU
========================= */

function updateDateTime() {
    const now = new Date();

    const dateOptions = {
        timeZone: "Asia/Jakarta",
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    };

    document.getElementById("date").textContent =
        "📅 " + now.toLocaleDateString("id-ID", dateOptions);

    document.getElementById("time").textContent =
        "⌚ " + now.toLocaleTimeString("id-ID", {
            timeZone: "Asia/Jakarta",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        });
}

updateDateTime();
setInterval(updateDateTime, 1000);


/* =========================
   PENGHITUNG KARAKTER
========================= */

const form = document.getElementById("aspirasiForm");
const namaInput = document.getElementById("nama");
const kelasInput = document.getElementById("kelas");
const isiInput = document.getElementById("isi");

const counter = document.getElementById("counter");
const fileInput = document.getElementById("fileInput");
const fileInfo = document.getElementById("fileInfo");
const previewContainer = document.getElementById("previewContainer");
const uploadError = document.getElementById("uploadError");

const submitBtn = document.getElementById("submitBtn");
const statusBox = document.getElementById("status");
const rocket = document.getElementById("rocket");

isiInput.addEventListener("input", () => {
    counter.textContent = `${isiInput.value.length}/1000`;
});


/* =========================
   PENGELOLAAN FILE
========================= */

const MAX_FILES = 3;
const MAX_FILE_SIZE = 4 * 1024 * 1024;
const MAX_TOTAL_SIZE = 5 * 1024 * 1024;

const ALLOWED_TYPES = new Set([
    "image/jpeg",
    "image/png",
    "image/webp",
    "video/mp4",
    "video/quicktime",
    "video/webm"
]);

let selectedFiles = [];
let objectURLs = [];

function clearPreviews() {
    objectURLs.forEach(url => URL.revokeObjectURL(url));
    objectURLs = [];
    previewContainer.replaceChildren();
}

function formatSize(bytes) {
    return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
}

function renderPreviews() {
    clearPreviews();

    const totalSize = selectedFiles.reduce(
        (sum, file) => sum + file.size,
        0
    );

    fileInfo.textContent = selectedFiles.length
        ? `${selectedFiles.length} file dipilih • ${formatSize(totalSize)}`
        : "";

    selectedFiles.forEach((file, index) => {
        const item = document.createElement("div");
        item.className = "preview-item";

        const url = URL.createObjectURL(file);
        objectURLs.push(url);

        let media;

        if (file.type.startsWith("video/")) {
            media = document.createElement("video");
            media.controls = true;
            media.preload = "metadata";
            media.playsInline = true;
        } else {
            media = document.createElement("img");
            media.alt = file.name;
        }

        media.src = url;

        const name = document.createElement("div");
        name.className = "preview-name";
        name.textContent = `${file.name} (${formatSize(file.size)})`;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove-file";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `Hapus ${file.name}`);

        remove.addEventListener("click", () => {
            selectedFiles.splice(index, 1);
            uploadError.textContent = "";
            renderPreviews();
        });

        item.append(media, name, remove);
        previewContainer.appendChild(item);
    });
}

fileInput.addEventListener("change", () => {
    uploadError.textContent = "";

    const incomingFiles = Array.from(fileInput.files || []);

    for (const file of incomingFiles) {
        if (!ALLOWED_TYPES.has(file.type)) {
            uploadError.textContent =
                `${file.name}: format file tidak didukung.`;
            continue;
        }

        if (file.size > MAX_FILE_SIZE) {
            uploadError.textContent =
                `${file.name}: ukuran maksimal 4 MB per file.`;
            continue;
        }

        const duplicate = selectedFiles.some(existing =>
            existing.name === file.name &&
            existing.size === file.size &&
            existing.lastModified === file.lastModified
        );

        if (duplicate) {
            continue;
        }

        if (selectedFiles.length >= MAX_FILES) {
            uploadError.textContent =
                "Maksimal 3 file untuk setiap aspirasi.";
            break;
        }

        const currentTotal = selectedFiles.reduce(
            (sum, item) => sum + item.size,
            0
        );

        if (currentTotal + file.size > MAX_TOTAL_SIZE) {
            uploadError.textContent =
                "Total ukuran semua lampiran maksimal 5 MB.";
            continue;
        }

        selectedFiles.push(file);
    }

    renderPreviews();

    // Izinkan pemilihan ulang file yang sama.
    fileInput.value = "";
});


/* =========================
   STATUS
========================= */

function setStatus(message, type = "") {
    statusBox.className = "status" + (type ? ` ${type}` : "");
    statusBox.textContent = message;
}


/* =========================
   KIRIM ASPIRASI
========================= */

form.addEventListener("submit", async event => {
    event.preventDefault();

    const nama = namaInput.value.trim();
    const kelas = kelasInput.value;
    const isi = isiInput.value.trim();

    if (!nama || !kelas || !isi) {
        setStatus("⚠️ Mohon lengkapi semua data.", "error");
        return;
    }

    if (nama.length > 100 || isi.length > 1000) {
        setStatus("⚠️ Data melebihi batas karakter.", "error");
        return;
    }

    const totalSize = selectedFiles.reduce(
        (sum, file) => sum + file.size,
        0
    );

    if (
        selectedFiles.length > MAX_FILES ||
        selectedFiles.some(file => file.size > MAX_FILE_SIZE) ||
        totalSize > MAX_TOTAL_SIZE
    ) {
        setStatus("⚠️ Periksa kembali ukuran lampiran.", "error");
        return;
    }

    const formData = new FormData();

    formData.append("nama", nama);
    formData.append("kelas", kelas);
    formData.append("isi", isi);

    selectedFiles.forEach(file => {
        formData.append("files", file, file.name);
    });

    submitBtn.disabled = true;
    submitBtn.textContent = "⏳ Mengirim...";
    setStatus("Mengirim aspirasi dan lampiran...");

    rocket.classList.remove("launch");
    void rocket.offsetWidth;
    rocket.classList.add("launch");

    try {
        const response = await fetch(
            "/.netlify/functions/aspirasi",
            {
                method: "POST",
                body: formData
            }
        );

        const contentType = response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
            throw new Error(
                "Server mengembalikan respons tidak valid. Periksa konfigurasi Netlify."
            );
        }

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Gagal mengirim aspirasi."
            );
        }

        setStatus(
            "✅ Aspirasi dan lampiran berhasil dikirim!",
            "success"
        );

        form.reset();

        selectedFiles = [];
        renderPreviews();

        counter.textContent = "0/1000";
        uploadError.textContent = "";

    } catch (error) {
        console.error("Pengiriman aspirasi gagal:", error);

        setStatus(
            error.message ||
            "❌ Gagal mengirim aspirasi. Silakan coba lagi.",
            "error"
        );

    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "🚀 Kirim Aspirasi";
    }
});


/* Bersihkan URL pratinjau ketika halaman ditutup. */

window.addEventListener("pagehide", clearPreviews);
</script>

</body>
</html>
